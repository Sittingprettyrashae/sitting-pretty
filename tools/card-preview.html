<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature & hero image crop preview</title>
<style>
/* Dev tool, never linked from the site. Drop generated images on a slot and
   see them inside the REAL rendered shapes (measured from the live site), so
   a bad crop is caught here instead of in production. */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:oklch(97.5% 0.009 60);color:oklch(27% 0.05 350);padding:2rem;line-height:1.5}
h1{font-size:1.3rem;margin-bottom:.3rem}
.hint{color:oklch(46% 0.035 345);font-size:.9rem;max-width:70ch;margin-bottom:2rem}
.slot{margin-bottom:3rem}
.slot h2{font-size:1rem;margin-bottom:.6rem}
.slot h2 code{background:oklch(95.5% 0.015 30);padding:.1rem .45rem;border-radius:.4rem;font-size:.85em}
.shapes{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start}
.shape{text-align:center}
.shape figcaption{font-size:.78rem;color:oklch(46% 0.035 345);margin-top:.45rem}
.box{overflow:hidden;background:oklch(95.5% 0.015 30);border-radius:14px;position:relative;box-shadow:0 4px 18px oklch(40% 0.05 350/.12)}
.box img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.box .label{position:absolute;left:.7rem;right:.5rem;bottom:.7rem;color:#fff;text-align:left;font-weight:800;font-size:.9rem;text-shadow:0 1px 8px rgba(30,10,20,.7);pointer-events:none}
.box::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(46,22,38,.78) 0%, rgba(46,22,38,.25) 38%, transparent 62%);pointer-events:none}
/* real measured shapes */
.d-rest{width:225px;height:432px}
.d-hover{width:387px;height:432px}
.mob{width:265px;height:380px}
/* hero shapes */
.hero-main{width:346px;height:432px;border-radius:34px 34px 34px 42%}
.hero-main img{object-position:center 20%}
.hero-main::after{display:none}
.hero-back{width:180px;height:180px;border-radius:18px;rotate:5deg;border:5px solid #fff}
.hero-back img{object-position:center}
.hero-back::after{display:none}
input[type=file]{margin-bottom:.8rem}
</style>
</head>
<body>
<h1>Does the hairstyle survive the crop?</h1>
<p class="hint">Pick a generated image for each slot below. Every box is the real rendered
shape from the live site. If the ends of the hair are cut, or the style loses its sides in
the narrow desktop card, regenerate that image with more empty space around the subject.</p>

<div id="slots"></div>

<script>
const SLOTS = [
  { key: "wigs", title: "Wig Installs card", file: "assets/signature/wigs.jpg", kind: "card", label: "Wig Installs" },
  { key: "knotless", title: "Knotless Braids card", file: "assets/signature/knotless.jpg", kind: "card", label: "Knotless Braids" },
  { key: "crochet", title: "Crochet card", file: "assets/signature/crochet.jpg", kind: "card", label: "Crochet" },
  { key: "quickweave", title: "Quickweaves card", file: "assets/signature/quickweave.jpg", kind: "card", label: "Quickweaves" },
  { key: "sewin", title: "Sew-Ins card", file: "assets/signature/sewin.jpg", kind: "card", label: "Sew-Ins" },
  { key: "heromain", title: "Hero, big portrait", file: "assets/hero/main.jpg", kind: "heromain" },
  { key: "heroback", title: "Hero, small polaroid", file: "assets/hero/back.jpg", kind: "heroback" },
];
const shapesFor = (s) => {
  if (s.kind === "card") return [
    ["d-rest", "desktop, at rest (narrowest)"],
    ["d-hover", "desktop, hovered"],
    ["mob", "mobile"],
  ];
  if (s.kind === "heromain") return [["hero-main", "hero portrait (uncropped 4:5, note the swept corner)"]];
  return [["hero-back", "hero polaroid (square, rotated)"]];
};
const root = document.getElementById("slots");
SLOTS.forEach((s) => {
  const div = document.createElement("div");
  div.className = "slot";
  div.innerHTML = `
    <h2>${s.title} &rarr; <code>${s.file}</code></h2>
    <input type="file" accept="image/*" data-slot="${s.key}">
    <div class="shapes">${shapesFor(s).map(([cls, cap]) => `
      <figure class="shape">
        <div class="box ${cls}">
          <img data-img="${s.key}" alt="">
          ${s.kind === "card" ? `<span class="label">${s.label}<br><span style="font-weight:700;font-size:.78rem;color:#e8c98f">from $—</span></span>` : ""}
        </div>
        <figcaption>${cap}</figcaption>
      </figure>`).join("")}
    </div>`;
  root.appendChild(div);
});
root.addEventListener("change", (e) => {
  const input = e.target.closest("input[type=file]");
  if (!input || !input.files || !input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  document.querySelectorAll(`img[data-img="${input.getAttribute("data-slot")}"]`)
    .forEach((img) => { img.src = url; });
});
</script>
</body>
</html>
